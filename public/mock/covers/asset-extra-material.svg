<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#92400E"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="700" cy="120" r="200" fill="white" fill-opacity="0.06"/>
  <!-- stacked documents -->
  <!-- bottom doc -->
  <rect x="210" y="340" width="320" height="240" rx="18" fill="white" fill-opacity="0.5" transform="rotate(8 370 460)"/>
  <!-- middle doc -->
  <rect x="220" y="310" width="320" height="240" rx="18" fill="white" fill-opacity="0.7" transform="rotate(3 380 430)"/>
  <!-- top doc -->
  <rect x="240" y="280" width="320" height="240" rx="18" fill="white" fill-opacity="0.92"/>
  <!-- lines on top doc -->
  <rect x="272" y="320" width="220" height="12" rx="6" fill="#92400E" fill-opacity="0.3"/>
  <rect x="272" y="348" width="220" height="12" rx="6" fill="#92400E" fill-opacity="0.2"/>
  <rect x="272" y="376" width="160" height="12" rx="6" fill="#92400E" fill-opacity="0.2"/>
  <!-- fold corner -->
  <path d="M520 280 L520 320 L560 280 Z" fill="#92400E" fill-opacity="0.25"/>
  <!-- clip icon -->
  <rect x="516" y="246" width="52" height="76" rx="10" fill="white" fill-opacity="0.2" stroke="white" stroke-opacity="0.5" stroke-width="4"/>
  <rect x="524" y="240" width="36" height="24" rx="12" fill="white" fill-opacity="0.8"/>
  <!-- label -->
  <rect x="150" y="648" width="500" height="76" rx="16" fill="white" fill-opacity="0.15"/>
  <text x="400" y="696" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="white">MATERIAL EXTRA</text>
</svg>
