  <rect x="248" y="306" width="118" height="10" rx="5" fill="#166534" fill-opacity="0.35"/>
  <rect x="248" y="332" width="118" height="10" rx="5" fill="#166534" fill-opacity="0.25"/>
  <rect x="248" y="358" width="96" height="10" rx="5" fill="#166534" fill-opacity="0.25"/>
  <rect x="248" y="384" width="118" height="10" rx="5" fill="#166534" fill-opacity="0.25"/>
  <rect x="248" y="410" width="80" height="10" rx="5" fill="#166534" fill-opacity="0.2"/>
  <!-- apple on right page -->
  <ellipse cx="492" cy="390" rx="56" ry="64" fill="#166534" fill-opacity="0.3"/>
  <path d="M492 326 Q510 300 530 316" stroke="#166534" stroke-opacity="0.4" stroke-width="6" fill="none" stroke-linecap="round"/>
