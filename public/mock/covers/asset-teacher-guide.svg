      <stop stop-color="#166534"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="700" cy="120" r="200" fill="white" fill-opacity="0.06"/>
  <!-- open book -->
  <!-- left page -->
  <path d="M220 260 L390 260 L390 540 Q305 520 220 540 Z" fill="white" fill-opacity="0.88"/>
  <!-- right page -->
  <path d="M410 260 L580 260 L580 540 Q495 520 410 540 Z" fill="white" fill-opacity="0.88"/>
