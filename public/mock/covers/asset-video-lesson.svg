<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F766E"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="700" cy="100" r="200" fill="white" fill-opacity="0.06"/>
  <!-- laptop / screen shape -->
  <rect x="180" y="240" width="440" height="300" rx="20" fill="white" fill-opacity="0.2"/>
  <rect x="200" y="260" width="400" height="260" rx="12" fill="white" fill-opacity="0.12"/>
  <!-- play triangle on screen -->
  <circle cx="400" cy="390" r="70" fill="white" fill-opacity="0.25"/>
  <polygon points="378,358 378,422 445,390" fill="white" fill-opacity="0.95"/>
  <!-- laptop base -->
  <rect x="140" y="540" width="520" height="28" rx="14" fill="white" fill-opacity="0.25"/>
  <rect x="270" y="540" width="260" height="12" rx="6" fill="white" fill-opacity="0.15"/>
  <!-- camera dot -->
  <circle cx="400" cy="252" r="9" fill="white" fill-opacity="0.35"/>
  <!-- label -->
  <rect x="160" y="648" width="480" height="76" rx="16" fill="white" fill-opacity="0.15"/>
  <text x="400" y="696" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="white">VIDEOAULA</text>
</svg>
