      - heading "Política de Trocas, Devoluções e Arrependimento" [level=2] [ref=e42]
      - paragraph [ref=e43]: A Loja Educacross deseja que sua experiência de compra seja segura, clara e acolhedora. Esta política explica como funcionam os pedidos de troca, devolução, arrependimento, análise de defeitos e atendimento relacionado aos produtos adquiridos em nossa loja online. A Loja Educacross pertence à Educacross Educação Ltda., inscrita no CNPJ 15.130.060/0001-04.
