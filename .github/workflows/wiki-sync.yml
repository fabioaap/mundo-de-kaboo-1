name: Wiki Sync

# Camada 1 (determinística):
#  - No PR: gate de frescor (código mudou → doc precisa mudar) + build da wiki.
#  - No merge para main (docs mudaram): re-indexa o RAG do assistente.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#  - SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY  (para o re-index)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'docs/docs/**'
  workflow_dispatch: {} # re-index manual sob demanda

# Token mínimo (só leitura do repo). Secrets só chegam ao job reindex (push).
permissions:
  contents: read

jobs:
  gate:
    if: github.event_name == 'pull_request'
    name: Gate de frescor + build da wiki
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # comentar o rascunho de changelog no PR (Camada 2)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo: gate (base...HEAD) + datas "última atualização"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar branch base
        run: git fetch origin ${{ github.base_ref }}

      - name: Gate de frescor (código sem doc)
        id: gate
        continue-on-error: true
        run: node scripts/wiki/doc-gate.mjs origin/${{ github.base_ref }}

      # Camada 2 — se o gate reprovou, a IA rascunha o changelog e comenta no PR.
      # A chave do LLM fica no Supabase; aqui só a anon key (pública, via vars).
      - name: Rascunhar changelog (IA, via Supabase)
        if: steps.gate.outcome == 'failure'
        env:
          WIKI_SUPABASE_URL: ${{ vars.WIKI_SUPABASE_URL }}
          WIKI_SUPABASE_ANON_KEY: ${{ vars.WIKI_SUPABASE_ANON_KEY }}
        run: node scripts/wiki/draft-changelog.mjs origin/${{ github.base_ref }}

      - name: Comentar rascunho no PR
        if: steps.gate.outcome == 'failure' && hashFiles('wiki-draft-changelog.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "🤖 **Gate da wiki:** este PR mexe em código sem atualizar a documentação."
            echo ""
            echo "Sugestão de entrada de changelog (revise e adicione em \`docs/docs/changelog/\`):"
            echo ""
            echo '```markdown'
            cat wiki-draft-changelog.md
            echo '```'
            echo ""
            echo "_🤖 Gerado por Claude Code (Camada 2 do doc-sync)_"
          } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md

      - name: Instalar deps da wiki
        working-directory: docs
        run: npm ci

      - name: Build da wiki (valida links quebrados)
        working-directory: docs
        run: npm run build

      - name: Falhar se o gate reprovou
        if: steps.gate.outcome == 'failure'
        run: |
          echo "Gate reprovou: adicione doc/changelog (veja o comentário no PR)."
          exit 1

  reindex:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Re-indexar o assistente (RAG)
    runs-on: ubuntu-latest
    # Evita dois re-index sobrepostos (delete + insert poderiam interleaves).
    concurrency:
      group: wiki-reindex
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar deps (raiz — supabase-js)
        run: npm ci

      - name: Re-indexar wiki_chunks
        run: node scripts/index-wiki.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
