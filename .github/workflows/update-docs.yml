name: 📚 Auto Update Documentation

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'components/**'
      - 'screens/**'
      - 'hooks/**'
      - 'lib/**'
      - 'types.ts'
      - '.github/workflows/update-docs.yml'
  pull_request:
    branches:
      - main
      - develop

jobs:
  update-docs:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: 📚 Install dependencies
        run: npm ci
      
      - name: 🔄 Update documentation
        run: npm run update-docs
      
      - name: 📝 Check for changes
        id: verify-changed-files
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: 🚀 Commit and push changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/ INFRAESTRUTURA.md
          git commit -m "docs: auto-update documentation [bot]"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
      
      - name: 💬 Comment on PR
        if: github.event_name == 'pull_request' && steps.verify-changed-files.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📚 Documentações foram atualizadas automaticamente! Confira as mudanças em `docs/` e `INFRAESTRUTURA.md`'
            })
      
      - name: ✅ Report success
        if: steps.verify-changed-files.outputs.changed == 'false'
        run: echo "✅ Documentações já estão atualizadas"
