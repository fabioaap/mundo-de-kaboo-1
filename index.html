<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#5D1F58" />
  <!-- CSP via meta tag (issue #59, débito de docs/qa/AUDITORIA-FULLSTACK-2026-06-25.md): cobre o que
       o browser permite fora de um header HTTP real. frame-ancestors, report-uri e sandbox são
       ignorados aqui por spec — só valem como header HTTP, que exige Azure CDN/Front Door na frente
       do Storage Static Website (não existe hoje, é infra nova — ver pesquisa registrada na issue).
       HSTS/X-Frame-Options/X-Content-Type-Options/Permissions-Policy também exigem header HTTP e
       ficam como débito até essa infra existir. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://mcp.figma.com https://www.youtube.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data: blob: https://*.supabase.co https://img.youtube.com https://i.ytimg.com;
    media-src 'self' blob: https://*.supabase.co;
    connect-src 'self' https://*.supabase.co wss://*.supabase.co https://mcp.figma.com https://www.youtube.com;
    frame-src https://www.youtube.com;
    object-src 'none';
    base-uri 'self';
  " />
  <!-- Achado de review (2026-07-04): o webhook de alerting white-label
       (lib/whiteLabelAdminApi.ts) faz fetch() do browser pra host ARBITRÁRIO
       configurado pelo admin (Slack/n8n/etc.) — a CSP acima vai bloquear
       qualquer host fora de connect-src, então esse recurso especificamente
       degrada (some sem aviso) sob esta CSP. Não dá pra resolver só com
       allowlist (o host é escolhido pelo admin, não fixo) — fica documentado
       como limitação conhecida até decidir uma abordagem (relay via edge
       function, ou aceitar a degradação). -->

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Mundo de Kaboo</title>

  <!-- Favicons for all platforms -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <!-- crossorigin=use-credentials: envia o cookie do Cloudflare Access junto com o
       fetch do manifesto, evitando o redirect pro login (que quebrava por CORS). -->
  <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />

  <!-- Meta tags for mobile platforms -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Mundo de Kaboo" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="msapplication-TileColor" content="#5D1F58" />
  <meta name="msapplication-TileImage" content="/favicon.ico" />

  <!-- Google Fonts: Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
    rel="stylesheet">
  <style>
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }

    body {
      background-color: #f3f4f6;
      -webkit-tap-highlight-color: transparent;
    }

    /* PDF CSS Reset */
    .react-pdf__Page__canvas {
      margin: 0 auto;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      border-radius: 8px;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      background: transparent !important;
    }

    .react-pdf__Page {
      display: flex !important;
      justify-content: center;
      align-items: center;
      background: transparent !important;
    }

    .react-pdf__Document {
      display: flex !important;
      justify-content: center;
      align-items: center;
      background: transparent !important;
    }

    .react-pdf__Document>div {
      background: transparent !important;
    }

    /* HTMLFlipBook (react-pageflip) transparent backgrounds */
    .stf__parent,
    .stf__wrapper,
    .tf__parent,
    .tf__wrapper {
      background: transparent !important;
    }

    /* react-zoom-pan-pinch transparent backgrounds */
    .react-transform-wrapper,
    .react-transform-component {
      background: transparent !important;
    }

    /* Faster modal animations */
    @keyframes fast-fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .fast-fade-in {
      animation: fast-fade-in 0.1s ease-out forwards;
    }

    /* Smooth content fade-in for modal */
    @keyframes content-fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .content-fade-in {
      animation: content-fade-in 0.25s ease-out forwards;
    }

    @keyframes skeleton-fade-out {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }

    .skeleton-fade-out {
      animation: skeleton-fade-out 0.2s ease-in forwards;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script>
    (() => {
      const captureScriptSrc = 'https://mcp.figma.com/mcp/html-to-design/capture.js';
      const captureScriptAttr = 'data-figma-capture-script';

      const ensureCaptureScript = () => {
        if (!window.location.hash.includes('figmacapture=')) {
          return;
        }

        if (document.querySelector(`script[${captureScriptAttr}]`)) {
          return;
        }

        const script = document.createElement('script');
        script.src = captureScriptSrc;
        script.async = true;
        script.setAttribute(captureScriptAttr, 'true');
        document.head.appendChild(script);
      };

      ensureCaptureScript();
      window.addEventListener('hashchange', ensureCaptureScript);
    })();
  </script>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
