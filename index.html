<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#5D1F58" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Mundo de Kaboo</title>
    
    <!-- Favicons for all platforms -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Meta tags for mobile platforms -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mundo de Kaboo" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#5D1F58" />
    <meta name="msapplication-TileImage" content="/favicon.ico" />
    
    <!-- Google Fonts: Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              kaboo: {
                primary: '#5D1F58', // Deep wine/purple
                light: '#883E82',
                bg: '#F9F5F9',
                accent: '#4EA8DE', // Light blue from reference
                green: '#70E000', // Bright green accent
              }
            },
            fontFamily: {
              sans: ['Nunito', 'ui-rounded', 'system-ui', 'sans-serif'],
            },
            borderRadius: {
              'xl': '1rem',
              '2xl': '1.5rem',
              '3xl': '2rem',
            },
            animation: {
              'blob': 'blob 25s infinite',
              'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '25%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '50%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '75%': { transform: 'translate(40px, 50px) scale(1.05)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
      body {
        background-color: #f3f4f6;
        -webkit-tap-highlight-color: transparent;
      }
      /* PDF CSS Reset */
      .react-pdf__Page__canvas {
        margin: 0 auto;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        border-radius: 8px;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
      }
      
      .react-pdf__Page {
        display: flex !important;
        justify-content: center;
        align-items: center;
      }
      
      .react-pdf__Document {
        display: flex !important;
        justify-content: center;
        align-items: center;
      }
      
      /* Faster modal animations */
      @keyframes fast-fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      
      .fast-fade-in {
        animation: fast-fade-in 0.1s ease-out forwards;
      }
      
      /* Smooth content fade-in for modal */
      @keyframes content-fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      
      .content-fade-in {
        animation: content-fade-in 0.25s ease-out forwards;
      }
      
      @keyframes skeleton-fade-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      
      .skeleton-fade-out {
        animation: skeleton-fade-out 0.2s ease-in forwards;
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
