<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#5D1F58" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Mundo de Kaboo</title>

  <!-- Favicons for all platforms -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.ico" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />

  <!-- Meta tags for mobile platforms -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Mundo de Kaboo" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="msapplication-TileColor" content="#5D1F58" />
  <meta name="msapplication-TileImage" content="favicon.ico" />

  <!-- Google Fonts: Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
    rel="stylesheet">
  <style>
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }

    body {
      background-color: #f3f4f6;
      -webkit-tap-highlight-color: transparent;
    }

    /* PDF CSS Reset */
    .react-pdf__Page__canvas {
      margin: 0 auto;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      border-radius: 8px;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      background: transparent !important;
    }

    .react-pdf__Page {
      display: flex !important;
      justify-content: center;
      align-items: center;
      background: transparent !important;
    }

    .react-pdf__Document {
      display: flex !important;
      justify-content: center;
      align-items: center;
      background: transparent !important;
    }

    .react-pdf__Document>div {
      background: transparent !important;
    }

    /* HTMLFlipBook (react-pageflip) transparent backgrounds */
    .stf__parent,
    .stf__wrapper,
    .tf__parent,
    .tf__wrapper {
      background: transparent !important;
    }

    /* react-zoom-pan-pinch transparent backgrounds */
    .react-transform-wrapper,
    .react-transform-component {
      background: transparent !important;
    }

    /* Faster modal animations */
    @keyframes fast-fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .fast-fade-in {
      animation: fast-fade-in 0.1s ease-out forwards;
    }

    /* Smooth content fade-in for modal */
    @keyframes content-fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .content-fade-in {
      animation: content-fade-in 0.25s ease-out forwards;
    }

    @keyframes skeleton-fade-out {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }

    .skeleton-fade-out {
      animation: skeleton-fade-out 0.2s ease-in forwards;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>

</html>
